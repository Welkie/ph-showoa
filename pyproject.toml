[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vrpenstein"
version = "0.1.0"
description = "PH-SHOWOA for VRPSPDTW"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cuda = ["numba>=0.60", "numba-cuda>=0.30.4; python_version >= '3.10'", "numpy<2.3"]

[project.scripts]
ph-showoa = "src.__main__:main"
vrpenstein = "src.__main__:main"

[tool.pyrefly]
preset = "basic"
python-interpreter-path = "C:/Program Files/Python313/python.exe"

[tool.pyrefly.errors]
division-by-zero = false



